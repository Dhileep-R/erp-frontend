server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    location /api/auth/ {
        proxy_pass https://auth-service.up.railway.app/;
    }

    location /api/procurement/ {
        proxy_pass https://procurement-service.up.railway.app/;
    }
}